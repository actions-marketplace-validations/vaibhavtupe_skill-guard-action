name: skill-guard
description: Quality gate for Agent Skills — validate, secure, and conflict-check your skills in CI.
author: vaibhavtupe
branding:
  icon: "shield"
  color: "purple"

inputs:
  command:
    description: "Command to run: validate, secure, conflict, check"
    required: false
    default: check
  path:
    description: Path to the skill directory
    required: true
  against:
    description: Path to skills directory or catalog YAML for conflict detection
    required: false
    default: ""
  config:
    description: Path to skill-guard.yaml config file
    required: false
    default: ""
  format:
    description: "Output format: text, json, markdown"
    required: false
    default: text
  fail-on-warning:
    description: Exit non-zero on warnings, not just errors
    required: false
    default: "false"
  version:
    description: skill-guard version to install (default latest)
    required: false
    default: ""
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
  embeddings:
    description: "Install embeddings dependencies (torch + skill-guard[embeddings])"
    required: false
    default: "false"

outputs:
  exit-code:
    description: Exit code from skill-guard
    value: ${{ steps.run.outputs.exit-code }}
  report-path:
    description: Path to the report file (when format=markdown)
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install skill-guard
      shell: bash
      run: |
        if [ "${{ inputs.embeddings }}" = "true" ]; then
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          if [ -n "${{ inputs.version }}" ]; then
            pip install "skill-guard[embeddings]==${{ inputs.version }}"
          else
            pip install "skill-guard[embeddings]"
          fi
        else
          if [ -n "${{ inputs.version }}" ]; then
            pip install "skill-guard==${{ inputs.version }}"
          else
            pip install skill-guard
          fi
        fi

    - name: Run skill-guard
      id: run
      shell: bash
      run: |
        # skill-guard has no --fail-on-warning CLI flag; that behavior is
        # config-driven (ci.fail_on_warning in skill-guard.yaml). When the
        # input is set, merge it into a temp config (on top of the caller's
        # --config, if any) rather than passing an invalid flag.
        CONFIG_ARG=""
        if [ "${{ inputs.fail-on-warning }}" = "true" ]; then
          MERGED_CONFIG="${{ runner.temp }}/skill-guard-merged.yaml"
          python3 "${{ github.action_path }}/scripts/merge_fail_on_warning.py" \
            "${{ inputs.config }}" "$MERGED_CONFIG"
          CONFIG_ARG="$MERGED_CONFIG"
        elif [ -n "${{ inputs.config }}" ]; then
          CONFIG_ARG="${{ inputs.config }}"
        fi

        ARGS="${{ inputs.command }} ${{ inputs.path }}"
        [ -n "${{ inputs.against }}" ] && ARGS="$ARGS --against ${{ inputs.against }}"
        [ -n "$CONFIG_ARG" ] && ARGS="$ARGS --config $CONFIG_ARG"
        [ -n "${{ inputs.format }}" ] && ARGS="$ARGS --format ${{ inputs.format }}"

        if [ "${{ inputs.format }}" = "markdown" ]; then
          REPORT="${{ runner.temp }}/skill-guard-report.md"
          skill-guard $ARGS > "$REPORT" || EXIT_CODE=$?
          echo "report-path=$REPORT" >> $GITHUB_OUTPUT
        else
          skill-guard $ARGS || EXIT_CODE=$?
        fi

        echo "exit-code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
        exit ${EXIT_CODE:-0}
